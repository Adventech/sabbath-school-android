name: Release Management

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: android-google-play-internal
  cancel-in-progress: false

jobs:
  update_draft_release:
    permissions:
      contents: write
      pull-requests: read
    runs-on: macos-latest
    steps:
      - uses: release-drafter/release-drafter@eada3c96a64734dd381cfbda23511034e328ddb0 # v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  submit-release:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate Actions policy
        run: python3 .github/scripts/validate_actions_policy.py

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Decrypt secrets
        run: ./release/decrypt-secrets.sh
        env:
          ENCRYPT_KEY: ${{ secrets.ENCRYPT_KEY }}

      - name: Generate build number
        run: echo "BUILD_NUMBER=${{github.run_number}}" > release/build_number.properties

      - name: Build Release
        run: ./gradlew app:bundleRelease app-tv:bundleRelease --stacktrace

      - name: Publish to Internal track
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJson: release/play-account.json
          packageName: com.cryart.sabbathschool
          track: internal
          status: completed
          whatsNewDirectory: distribution/whatsnew
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt

      - name: Publish to TV Internal track
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJson: release/play-account.json
          packageName: com.cryart.sabbathschool
          track: tv:internal
          status: completed
          whatsNewDirectory: distribution/whatsnew
          releaseFiles: app-tv/build/outputs/bundle/release/app-tv-release.aab
          mappingFile: app-tv/build/outputs/mapping/release/mapping.txt

name: CI

on:
  push:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate Actions policy
        run: python3 .github/scripts/validate_actions_policy.py

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Decrypt secrets
        run: ./release/decrypt-secrets.sh
        env:
          ENCRYPT_KEY: ${{ secrets.ENCRYPT_KEY }}

      - name: Run Code Quality Checks
        run: ./gradlew check

      - name: Screenshot Tests
        run : ./gradlew testDebugUnitTest -Proborazzi.test.verify=true
        # run: ./gradlew globalCiVerifyRoborazzi -Pfoundry.test.snapshots=true -Proborazzi.cleanupOldScreenshots=true --stacktrace
